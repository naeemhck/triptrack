project_id = "triptrack"

[api]
enabled = true
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 15

[auth]
enabled = true
site_url = "triptrack://auth/callback"
additional_redirect_urls = ["triptrack://auth/callback", "triptrack://auth/reset-password"]

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.send-stop-notification]
verify_jwt = false

[functions.send-lag-alert]
verify_jwt = false

[functions.check-stale-locations]
verify_jwt = false

[functions.delete-account]
verify_jwt = true
